name: backend-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Secret scan for introduced commits
        env:
          SECRET_SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          range="$SECRET_SCAN_BASE..$GITHUB_SHA"
          if [ -z "$SECRET_SCAN_BASE" ] || printf '%s' "$SECRET_SCAN_BASE" | grep -Eq '^0+$'; then
            range=-1
          fi
          docker run --rm \
            -v "$PWD:/repo:ro" \
            zricethezav/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 \
            git /repo --log-opts="$range" --redact --exit-code 1 --no-banner
      - name: Immutable workflow and base-image references
        run: |
          if grep -REn 'uses:[[:space:]]+[^[:space:]#]+@(v[0-9]+|main|master|latest)([[:space:]#]|$)' .github/workflows; then
            echo "GitHub Actions must be pinned to full commit SHAs." >&2
            exit 1
          fi
          if ! find . -type f -name 'Dockerfile*' -print0 |
            xargs -0 awk '
              toupper($1) == "FROM" &&
              $2 ~ /[/:]/ &&
              $2 !~ /@sha256:[0-9a-f]{64}$/ {
                print FILENAME ":" FNR ":" $0
                invalid = 1
              }
              END { exit invalid }
            '; then
            echo "External Dockerfile base images must be pinned by digest." >&2
            exit 1
          fi
      - name: Production runtime base security contract
        run: bash scripts/check-runtime-base-security.sh
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Event contract compatibility
        env:
          EVENT_CONTRACT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-event-contracts.mjs --baseline-ref="$EVENT_CONTRACT_BASE"
      - name: Observability contract
        run: node scripts/check-observability-contract.mjs
      - name: Container runtime ownership
        run: node scripts/check-container-runtime-ownership.mjs
      - name: Notification stream reliability
        run: node scripts/check-notification-stream-contract.mjs
      - name: Auth production contract
        run: node scripts/check-auth-production-contract.mjs
      - name: Restore
        run: dotnet restore warptalk-backend.slnx --locked-mode
      - name: Build
        run: dotnet build warptalk-backend.slnx --configuration Release --no-restore --warnaserror
      - name: Test
        run: |
          mkdir -p artifacts/test-results
          while IFS= read -r project; do
            name="$(basename "$project" .csproj)"
            dotnet test "$project" \
              --configuration Release \
              --no-build \
              --no-restore \
              --logger "trx;LogFileName=${name}.trx" \
              --results-directory artifacts/test-results
          done < <(find . -path '*/tests/*.Tests.csproj' -print | sort)
      - name: Dependency vulnerability gate
        run: |
          output="$(dotnet list warptalk-backend.slnx package --vulnerable --include-transitive)"
          printf '%s\n' "$output"
          ! printf '%s\n' "$output" | grep -q 'has the following vulnerable packages'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-test-results
          path: artifacts/test-results
