syntax = "proto3";

option csharp_namespace = "WarpTalk.Shared.Protos";

package user;

service UserService {
  rpc GetUserById (GetUserRequest) returns (GetUserResponse);
  rpc GetUserByEmail (GetUserByEmailRequest) returns (GetUserResponse);
  rpc GetUserSettings (GetUserRequest) returns (GetUserSettingsResponse);
  rpc GetRoleByName (GetRoleByNameRequest) returns (GetRoleResponse);
  rpc GetRoleById (GetRoleByIdRequest) returns (GetRoleResponse);

  // Whether this person has an active grant to have their voice cloned.
  //
  // A bool and not the consent record: the caller (TranslationRoomService, deciding whether an
  // audio route may enable voice cloning) has no business with the audit fields, and a narrow
  // answer is one that cannot start being used for something else.
  rpc HasVoiceCloneConsent (GetUserRequest) returns (HasVoiceCloneConsentResponse);

  // WT-396: the voice this person chose to be DUBBED IN, if they chose one.
  //
  // Not the voice they hear other people in — that is a different preference, stored separately,
  // and the two sharing a table is the reason an uploaded recording changed nothing. Empty means
  // "not chosen", and the caller falls back to cloning the speaker live from the meeting.
  rpc GetPreferredVoice (GetUserRequest) returns (GetPreferredVoiceResponse);

  // WT-699 / TC4104: the audience of a BROADCAST admin announcement. Ids only, keyset-paged by id,
  // active and not deleted — the notification service resolves "everyone" with it and needs
  // nothing else about the people it is writing to.
  rpc ListActiveUserIds (ListActiveUserIdsRequest) returns (ListActiveUserIdsResponse);

  // G10: what this person may do in the platform-admin portal. Every service's admin endpoints ask
  // this (through a short per-process cache) instead of trusting a role claim in the access token,
  // so a suspended or removed staff member is refused within seconds rather than when their token
  // expires. is_staff is false for "not staff", "suspended" and "no such user" alike.
  rpc GetStaffAccess (GetUserRequest) returns (GetStaffAccessResponse);
}

message GetStaffAccessResponse {
  bool is_staff = 1;
  // Stable key of the staff role: super_admin, support, ... or a custom role's slug.
  string role_slug = 2;
  string role_name = 3;
  // Super Admin holds every permission by rule; permissions below is empty for it.
  bool is_super_admin = 4;
  // Codes from WarpTalk.Shared.Authorization.AdminPermissions.
  repeated string permissions = 5;
}

message ListActiveUserIdsRequest {
  // Empty for the first page; otherwise the next_page_token of the previous page.
  string page_token = 1;
  // Clamped server-side to 1..1000.
  int32 page_size = 2;
}

message ListActiveUserIdsResponse {
  repeated string user_ids = 1;
  // Empty when this was the last page.
  string next_page_token = 2;
}

message GetUserRequest {
  string id = 1;
}

message GetUserByEmailRequest {
  string email = 1;
}

message GetUserResponse {
  string id = 1;
  string email = 2;
  string full_name = 3;
  string avatar_url = 4;
  string preferred_language = 5;
}

message GetUserSettingsResponse {
  bool found = 1;
  string default_speak_language = 2;
  string default_listen_language = 3;

  // WT-401: the account-level "Enable Voice Cloning" preference.
  //
  // This is a WISH, not a permission. It says the person would like their own voice used when
  // they speak in a meeting; whether that is allowed is HasVoiceCloneConsent, which is a
  // separate RPC on purpose and stays the gate in front of biometric processing.
  //
  // It is here because the preference had no way to reach a meeting at all: the switch in
  // Settings wrote to AuthService and nothing ever read it, while the only field the dub
  // actually consults — TranslationRoomAudioRoute.VoiceCloneEnabled — was hard-coded false.
  // Users saw "Enable Voice Cloning: On", heard a stock voice, and concluded the cloning was
  // bad rather than switched off.
  bool voice_clone_enabled = 4;
}

message GetRoleByNameRequest {
  string name = 1;
}

message GetRoleByIdRequest {
  string id = 1;
}

message GetRoleResponse {
  string id = 1;
  string name = 2;
  string description = 3;
}

message HasVoiceCloneConsentResponse {
  // False whenever the answer is not a live grant — never asked, withdrawn, or expired. The
  // caller must treat any failure to reach this service the same way.
  bool granted = 1;
}

message GetPreferredVoiceResponse {
  // The provider's own id for the chosen voice. Empty when the person has not chosen one, when
  // the profile behind their choice has no provider voice yet — an uploaded sample not yet
  // cloned — or when this service cannot answer. Empty always means "fall back", never "silence".
  string voice_id = 1;
  // "cartesia". Carried so a caller can refuse a voice from a provider it does not speak to,
  // rather than passing an id that provider will not recognise.
  string provider = 2;

  // WT-B — the voice this person was cloned into in an EARLIER meeting, so the next meeting can
  // open in their own voice instead of spending its first twenty seconds in a stock one.
  //
  // DELIBERATELY NOT voice_id, AND THAT SEPARATION IS LOAD-BEARING. voice_id above is a
  // DELIBERATE PICK: the worker must stop capturing and never overwrite it. This is the
  // opposite — a starting point the worker is supposed to keep improving on. Delivered on one
  // field, a carried clone would be read as a pick, capture would stop, and every speaker would
  // be frozen at the first clone they ever earned.
  //
  // Empty when there is none, when this service cannot answer, or when the person has withdrawn
  // voice-clone consent. Empty always means "clone them live", never "silence".
  string auto_clone_voice_id = 3;

  // How good the clip behind auto_clone_voice_id was (0..1) — the bar a later clip must beat
  // before it replaces the voice.
  //
  // EMPTY IS "NOT MEASURED" AND MUST NOT BE READ AS ZERO. A string rather than a double for
  // exactly this reason: proto3 scalars have no null, so a double would arrive as 0.0 for an
  // unmeasured voice, which grades as the worst possible sample and invites replacement by
  // literally any clip that clears the floors.
  string auto_clone_score = 4;
}
