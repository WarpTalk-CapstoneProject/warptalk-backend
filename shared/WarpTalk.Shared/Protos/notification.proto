syntax = "proto3";

option csharp_namespace = "WarpTalk.Shared.Protos";

package notification;

service NotificationGrpcService {
  rpc SendNotification (SendNotificationRequest) returns (SendNotificationResponse);
  rpc GetUserPreferences (GetUserPreferencesRequest) returns (GetUserPreferencesResponse);
  rpc MarkAsRead (MarkAsReadRequest) returns (MarkAsReadResponse);
  rpc MarkAllAsRead (MarkAllAsReadRequest) returns (MarkAllAsReadResponse);
  // The admin-edited version of a transactional email, read by every service that sends one
  // (auth, workspace, translation-room). found=false means "use the built-in wording" — either
  // nobody edited it or it was reset to default.
  rpc GetEmailTemplate (GetEmailTemplateRequest) returns (GetEmailTemplateResponse);
  // One email handed to a provider (or refused by it), counted per template, locale and day for
  // the CMS's delivery stats. Fire-and-forget from the sender's side.
  rpc RecordEmailDelivery (RecordEmailDeliveryRequest) returns (RecordEmailDeliveryResponse);
}

message RecordEmailDeliveryRequest {
  string template_key = 1;
  string locale = 2;
  bool succeeded = 3;
  int32 version = 4;
}

message RecordEmailDeliveryResponse {
  bool recorded = 1;
}

message GetEmailTemplateRequest {
  // An EmailTemplateCatalog key, e.g. "auth.verify-email".
  string template_key = 1;
  // The recipient's language ("vi", "ja"...). Empty means English. The published content for it
  // is returned, falling back to English; drafts are never returned.
  string locale = 2;
}

message GetEmailTemplateResponse {
  bool found = 1;
  string subject = 2;
  string heading = 3;
  string body_html = 4;
  int32 version = 5;
  // CMS v2. Content with partials expanded, and the layout it uses (empty = built-in layout).
  string preheader = 6;
  // Hand-written plain text; empty = derive it from the HTML.
  string text_body = 7;
  string layout_html = 8;
  string layout_text = 9;
  string layout_dark_css = 10;
  // The locale the content is written in, after fallback.
  string locale = 11;
}

message SendNotificationRequest {
  string user_id = 1;
  string type = 2;
  string title = 3;
  string body = 4;
  string action_url = 5;
  map<string, string> metadata = 6;
}

message SendNotificationResponse {
  bool success = 1;
  string notification_id = 2;
}

message GetUserPreferencesRequest {
  string user_id = 1;
}

message NotificationChannelPreference {
  string channel = 1;
  bool enabled = 2;
}

message GetUserPreferencesResponse {
  string user_id = 1;
  repeated NotificationChannelPreference preferences = 2;
}

message MarkAsReadRequest {
  string user_id = 1;
  string notification_id = 2;
}

message MarkAsReadResponse {
  bool success = 1;
  string error_message = 2;
  string error_code = 3;
}

message MarkAllAsReadRequest {
  string user_id = 1;
}

message MarkAllAsReadResponse {
  bool success = 1;
  string error_message = 2;
  string error_code = 3;
}
