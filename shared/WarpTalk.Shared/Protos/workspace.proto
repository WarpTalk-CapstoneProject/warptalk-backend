syntax = "proto3";

option csharp_namespace = "WarpTalk.Shared.Protos";

package workspace;

service WorkspaceService {
  rpc GetWorkspaceMemberDetails (GetWorkspaceMemberRequest) returns (GetWorkspaceMemberResponse);
  rpc ValidateMeetingCreation (ValidateMeetingCreationRequest) returns (ValidateMeetingCreationResponse);
  rpc GetWorkspaceSettings (GetWorkspaceSettingsRequest) returns (GetWorkspaceSettingsResponse);
  rpc GetWorkspacePreflightDetails (GetWorkspacePreflightRequest) returns (GetWorkspacePreflightResponse);
  rpc GetWorkspaceNames (GetWorkspaceNamesRequest) returns (GetWorkspaceNamesResponse);
  rpc GetSharedWorkspaceMembers (GetSharedWorkspaceMembersRequest) returns (GetSharedWorkspaceMembersResponse);
}

// WT-335: "which of these users share an active workspace with this caller?"
//
// A batch intersection rather than a membership probe per user id. The Gateway's presence query
// accepts up to 500 ids on a hot path, so asking GetWorkspaceMemberDetails per id would be 500
// round trips -- a performance defect swapped in for a security one. This answers the whole set in
// one call, which WorkspaceService serves with one indexed self-join.
message GetSharedWorkspaceMembersRequest {
  string caller_user_id = 1;
  repeated string candidate_user_ids = 2;
}

message GetSharedWorkspaceMembersResponse {
  // The subset of candidate_user_ids that share at least one active workspace with the caller.
  // Ids the caller may not see are simply absent -- there is no "denied" marker, because a marker
  // would confirm the account exists, which is the leak this closes.
  repeated string visible_user_ids = 1;
}

message GetWorkspaceNamesRequest {
  repeated string workspace_ids = 1;
}

message WorkspaceNameItem {
  string workspace_id = 1;
  string workspace_name = 2;
}

message GetWorkspaceNamesResponse {
  repeated WorkspaceNameItem workspaces = 1;
}

message GetWorkspaceMemberRequest {
  string workspace_id = 1;
  string user_id = 2;
}

message GetWorkspaceMemberResponse {
  bool is_member = 1;
  string role_name = 2;
  string membership_type = 3; // INTERNAL, EXTERNAL
  // The MEMBER's status, not the workspace's. A suspended workspace still reports its members
  // as active — ask GetWorkspacePreflightDetails for the tenant's own lifecycle.
  bool is_active = 4;
  bool can_create_meetings = 5;
}

message ValidateMeetingCreationRequest {
  string workspace_id = 1;
  string user_id = 2;
  repeated string target_languages = 3;
  // WT-466: the room's SOURCE language, which the workspace policy never used to see.
  //
  // AllowedTargetLanguages was applied to target_languages alone, so a workspace that had
  // narrowed itself to vi/en/ja still accepted a room CREATED IN Spanish -- the host's own
  // speaking language was outside the policy and nothing looked at it. Optional: an empty
  // string means "not stated", and is not treated as a violation.
  string source_language = 4;
}

message ValidateMeetingCreationResponse {
  bool is_allowed = 1;
  string error_message = 2;
}

message GetWorkspaceSettingsRequest {
  string workspace_id = 1;
}

message GetWorkspaceSettingsResponse {
  int32 artifact_retention_days = 1;
  bool allow_external_collaboration = 2;
  bool is_profanity_filter_enabled = 3;
  // Product invariant: always true because WarpTalk has no local model.
  // Document approval and AiEligible remain separate authorization gates.
  bool allow_external_llm = 4;
  // Resolved AiUsagePolicy.UseGlobalGlossary, opt-out semantics: unset ⇒ true. Read by
  // GlossaryStartedEventConsumer (TranscriptService) to decide whether the system-managed
  // global glossary is merged into this workspace's STT/MT prompts. See
  // docs/global-glossary-plan.md §2.4.
  bool use_global_glossary = 5;
  // WT-343: enforce_host_approval_default lived here for one release. Host approval is a
  // per-meeting decision made in the create dialog, and a workspace-wide default for it was a
  // second place to set the same thing — the owner removed it rather than keep two.
  //
  // RESERVED, not simply deleted: a future field reusing number 6 would be read as this bool by
  // any peer still running the old generated code, which is a wire-compatibility break that
  // compiles cleanly on both sides.
  reserved 6;
  reserved "enforce_host_approval_default";
  // WT-466: the workspace's allowed-language whitelist, so a caller can apply the policy on a
  // path that is not meeting CREATION.
  //
  // ValidateMeetingCreation is the only gate that ever enforced this list, and it runs once, at
  // create. Editing a room (PATCH /translation-rooms/{id}) rewrites source_language and
  // target_languages after checking nothing but global platform support -- so a room created
  // within policy could be edited straight back out of it. This field is what lets the edit
  // path apply the same rule without borrowing a permission-and-quota gate that would also
  // re-count active rooms and deny the edit for the room being edited.
  //
  // EMPTY MEANS UNRESTRICTED, exactly as it does on the workspace side. A caller must branch on
  // "no entries" before filtering, or every workspace that never set a policy is locked out.
  repeated string allowed_target_languages = 7;
}

message GetWorkspacePreflightRequest {
  string workspace_id = 1;
  // Optional. Leave empty to skip the verified-domain lookup entirely — that is how
  // TranslationRoomService uses this RPC as a cheap tenant-lifecycle check when a
  // participant joins a room or a host starts one.
  string user_email = 2;
}

message GetWorkspacePreflightResponse {
  // The WORKSPACE's own lifecycle: false once a system admin suspends or soft-deletes it.
  // This is the tenant kill switch — GetWorkspaceMemberResponse.is_active is not.
  bool is_active = 1;
  string workspace_name = 2;
  string workspace_slug = 3;
  bool is_domain_matched = 4;
  bool allow_external_collaboration = 5;
}
