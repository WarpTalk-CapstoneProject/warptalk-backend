syntax = "proto3";

option csharp_namespace = "WarpTalk.Shared.Protos";

package workspace;

service WorkspaceService {
  rpc GetWorkspaceMemberDetails (GetWorkspaceMemberRequest) returns (GetWorkspaceMemberResponse);
  rpc ValidateMeetingCreation (ValidateMeetingCreationRequest) returns (ValidateMeetingCreationResponse);
  rpc GetWorkspaceSettings (GetWorkspaceSettingsRequest) returns (GetWorkspaceSettingsResponse);
  rpc GetWorkspacePreflightDetails (GetWorkspacePreflightRequest) returns (GetWorkspacePreflightResponse);
  rpc GetWorkspaceNames (GetWorkspaceNamesRequest) returns (GetWorkspaceNamesResponse);
}

message GetWorkspaceNamesRequest {
  repeated string workspace_ids = 1;
}

message WorkspaceNameItem {
  string workspace_id = 1;
  string workspace_name = 2;
}

message GetWorkspaceNamesResponse {
  repeated WorkspaceNameItem workspaces = 1;
}

message GetWorkspaceMemberRequest {
  string workspace_id = 1;
  string user_id = 2;
}

message GetWorkspaceMemberResponse {
  bool is_member = 1;
  string role_name = 2;
  string membership_type = 3; // INTERNAL, EXTERNAL
  // The MEMBER's status, not the workspace's. A suspended workspace still reports its members
  // as active — ask GetWorkspacePreflightDetails for the tenant's own lifecycle.
  bool is_active = 4;
  bool can_create_meetings = 5;
}

message ValidateMeetingCreationRequest {
  string workspace_id = 1;
  string user_id = 2;
  repeated string target_languages = 3;
}

message ValidateMeetingCreationResponse {
  bool is_allowed = 1;
  string error_message = 2;
}

message GetWorkspaceSettingsRequest {
  string workspace_id = 1;
}

message GetWorkspaceSettingsResponse {
  int32 artifact_retention_days = 1;
  bool allow_external_collaboration = 2;
  bool is_profanity_filter_enabled = 3;
  // Product invariant: always true because WarpTalk has no local model.
  // Document approval and AiEligible remain separate authorization gates.
  bool allow_external_llm = 4;
  // Resolved AiUsagePolicy.UseGlobalGlossary, opt-out semantics: unset ⇒ true. Read by
  // GlossaryStartedEventConsumer (TranscriptService) to decide whether the system-managed
  // global glossary is merged into this workspace's STT/MT prompts. See
  // docs/global-glossary-plan.md §2.4.
  bool use_global_glossary = 5;
}

message GetWorkspacePreflightRequest {
  string workspace_id = 1;
  // Optional. Leave empty to skip the verified-domain lookup entirely — that is how
  // TranslationRoomService uses this RPC as a cheap tenant-lifecycle check when a
  // participant joins a room or a host starts one.
  string user_email = 2;
}

message GetWorkspacePreflightResponse {
  // The WORKSPACE's own lifecycle: false once a system admin suspends or soft-deletes it.
  // This is the tenant kill switch — GetWorkspaceMemberResponse.is_active is not.
  bool is_active = 1;
  string workspace_name = 2;
  string workspace_slug = 3;
  bool is_domain_matched = 4;
  bool allow_external_collaboration = 5;
}
