syntax = "proto3";

option csharp_namespace = "WarpTalk.Shared.Protos";

package translation_room;

service TranslationRoomService {
  rpc GetTranslationRoomById (GetTranslationRoomRequest) returns (GetTranslationRoomResponse);
  rpc GetTranslationRoomByCode (GetTranslationRoomByCodeRequest) returns (GetTranslationRoomResponse);
  rpc GetParticipantsByRoomId (GetParticipantsByRoomIdRequest) returns (GetParticipantsByRoomIdResponse);
  rpc GetActiveRoomCountByWorkspace (GetActiveRoomCountByWorkspaceRequest) returns (GetActiveRoomCountByWorkspaceResponse);

  // WT-359: the ONE write on this service. MeetingService owns the Transfer Host action and
  // authorizes it, but host authority is read out of this service's tables on every join and every
  // host-gated operation — so a transfer that does not reach here is a transfer that silently
  // undoes itself the next time the old host rejoins.
  rpc TransferRoomHost (TransferRoomHostRequest) returns (TransferRoomHostResponse);

  // WT-564: the second write, and it exists for the same reason as TransferRoomHost above.
  //
  // KICKED is a TERMINAL status stored here, and it is what JoinTranslationRoomAsync checks
  // (BR-010) before letting anybody back into a room. The kick ACTION is owned and authorized by
  // MeetingService, whose own kick evicted the participant from LiveKit, deactivated its local
  // participant row and revoked the meeting invitation — and never touched this service. The
  // roster row was therefore left CONNECTED, becoming DISCONNECTED when the socket dropped, which
  // the rejoin path reads as "already admitted" and waves straight back in.
  //
  // A kick that does not reach here is not a kick; it is a disconnection the person can undo.
  rpc KickRoomParticipant (KickRoomParticipantRequest) returns (KickRoomParticipantResponse);
}

message GetTranslationRoomRequest {
  string id = 1;
}

message GetTranslationRoomByCodeRequest {
  string room_code = 1;
}

message GetTranslationRoomResponse {
  string id = 1;
  string title = 2;
  string hostId = 3;
  string workspace_id = 4;
  string status = 5;
  string started_at = 6;
  string ended_at = 7;
  string scheduled_start_time = 8;
  bool is_profanity_filter_enabled = 9;
  string description = 10;
  // WT-428: whether joins must pass host approval. Meeting Service gates its lobby on this;
  // before the field existed it keyed the lobby on room STATUS, so an IN_PROGRESS room admitted
  // anyone. Note proto3's default is FALSE while the room-settings default is TRUE — readers
  // must treat a response from an older server (or a stale cached proto) as fail-open and
  // re-fetch rather than trust the default.
  bool requires_approval = 11;
  // WT-525: which kind of meeting this is (TranslationRoomTypes). Meeting Service needs it to
  // gate the bridge-token endpoint, which mints a LiveKit token for a participant identity that
  // is NOT the caller — something no other endpoint does, and something that must be impossible
  // in an ordinary room. Deriving "is this a bridge" from anything softer than the room's own
  // stored type would make that gate guessable.
  //
  // proto3 defaults this to "" on a response from an older server, and readers MUST treat empty
  // as "not a bridge" rather than falling back to a permissive default: the failure this guards
  // is minting a second identity into someone else's meeting.
  string translation_room_type = 12;
  // WT-587: whether this meeting is to be written down at all. TranscriptService's persistence
  // consumer gates every INSERT on it; false means captions and translation still run and nothing
  // reaches transcript_segments.
  //
  // `optional` — i.e. real field presence — rather than a bare bool, and that is the whole point
  // of the field's shape. proto3 defaults a bare bool to FALSE, and FALSE here means "discard this
  // meeting's record". A reader talking to an older server, or holding a stale generated proto,
  // would have read that default as a deliberate instruction to stop recording every room in the
  // system, silently and irreversibly. With presence, absent means "this server predates the
  // field", which the reader answers by persisting — the direction that loses nothing.
  //
  // Compare requires_approval above, which has the same proto3 default problem in the harmless
  // direction and documents a re-fetch instead. Data loss does not get to be a fail-open case.
  optional bool save_transcript = 13;
}

// WT-359. Carries the requester because THIS service decides whether they may transfer: host
// authority is its data, and an authorization rule evaluated anywhere else is a copy that drifts.
// MeetingService's own check governs the live session; this one governs the room.
//
// The rule is "the effective host, and only them" — deliberately excluding the booker once they
// have handed the room over. WT-359's expected behaviour is explicit that the outgoing host gets
// the room back only if the incoming host transfers it back.
message TransferRoomHostRequest {
  string room_id = 1;
  string new_host_user_id = 2;
  string requested_by_user_id = 3;
}

message TransferRoomHostResponse {
  // The host this replaced, so the caller can name both sides in the realtime event without a
  // second read. Empty when the room had never been transferred and the booker was still running it.
  string previous_host_user_id = 1;
}

message KickRoomParticipantRequest {
  string room_id = 1;
  // The USER, not the participant row: MeetingService knows who it evicted, not which row on this
  // service records them.
  string participant_user_id = 2;
  string requested_by_user_id = 3;
}

message KickRoomParticipantResponse {
  // False when the person had no roster row to terminate — the kick still succeeded, and saying so
  // lets the caller tell "nothing to do" apart from "refused".
  bool kicked = 1;
}

message GetParticipantsByRoomIdRequest {
  string room_id = 1;
}

message GetParticipantsByRoomIdResponse {
  repeated Participant participants = 1;
}

message GetActiveRoomCountByWorkspaceRequest {
  string workspace_id = 1;
}

message GetActiveRoomCountByWorkspaceResponse {
  int32 count = 1;
}

message Participant {
  string id = 1;
  string display_name = 2;
  string role = 3;       // HOST, PARTICIPANT
  string language = 4;   // e.g. "vi-VN"
  bool is_active = 5;
}
